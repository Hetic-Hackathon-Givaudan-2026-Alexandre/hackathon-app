# Le type Spike est créé par le tech-lead (Settings de l'organisation → Planning → Issue types)
name: Spike
description: Exploration Data/IA en temps limité
type: Spike
body:
  - type: markdown
    attributes:
      value: Le titre est la question à trancher.
  - type: input
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: methode
    attributes:
      label: Méthode
      placeholder: Jeu de questions ou de données testé, et comment chaque résultat est noté.
    validations:
      required: true
  - type: input
    id: seuil
    attributes:
      label: Seuil de décision (chiffré)
      placeholder: ex. au moins 8 tendances sur 10 correctement classées
    validations:
      required: true
  - type: dropdown
    id: duree
    attributes:
      label: Durée maximale
      options:
        - ½ jour
        - 1 jour
    validations:
      required: true
  - type: input
    id: livrable
    attributes:
      label: Livrable
      value: Un notebook dans ia/ et la décision écrite dans ce ticket
