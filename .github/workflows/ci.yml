name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  qualite:
    runs-on: ubuntu-latest
    # Même Node et même Debian que le dev container
    container: node:24-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatage
        run: npm run format:check
      - name: Build
        run: npm run build
