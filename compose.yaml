name: hackathon

services:
  # Le site complet (front + API), lancé par `docker compose up` (jalon m2)
  web:
    build: .
    ports:
      - '8080:3000'
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      # Ollama sur la machine par défaut ; surchargeable par un fichier .env
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_MODEL: ${AI_MODEL:-llama3.2:1b}
      AI_API_KEY: ${AI_API_KEY:-ollama}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      # Les données, dans un dossier du projet (ignoré par git)
      - ./db/data:/var/lib/postgresql/data
      # Schéma et données de test, joués au premier démarrage seulement
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  # Poste de travail du dev container (VS Code s'y attache)
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    # Permet de joindre Ollama lancé sur la machine hôte (aussi sous Linux)
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
